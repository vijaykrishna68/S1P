<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AmountSelector — preview</title></head>
<body>
<div id="root" class="s1-stack"></div>
<script>
var S = window.S1P, h = React.createElement, useState = React.useState;
function Demo() {
  var s = useState(500), v = s[0], set = s[1];
  return h('div', { style: { display: 'grid', gap: 36, maxWidth: 560 } },
    h(S.AmountSelector, { label: 'Choose an amount', currency: '₹', amounts: [250, 500, 1000, 2500], value: v, onChange: set, hint: 'Example amounts — replace with S1P’s approved suggested amounts.' }),
    h(S.AmountSelector, { label: 'With an error', currency: '₹', amounts: [250, 500, 1000], value: null, error: 'Choose an amount or enter your own.' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

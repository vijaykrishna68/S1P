<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TextField — preview</title></head>
<body>
<div id="root" class="s1-stack"></div>

  h(S.TextField, { label: 'Email', required: true, type: 'email', defaultValue: 'name@example', hint: 'We send the receipt here.', error: 'Enter an email address like name@example.com.' }),
  h(S.TextField, { label: 'Amount', prefix: '₹', inputMode: 'decimal', defaultValue: '750', success: 'Looks good.' }),

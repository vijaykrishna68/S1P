<!-- @dsCard group="Admin" height=300 width=900 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AdminTable — preview</title></head>
<body>
<div id="root" class="s1-stack"></div>
<script>
var S = window.S1P, h = React.createElement, useState = React.useState;
var Pub = S.PublishStatus;
ReactDOM.createRoot(document.getElementById('root')).render(h(S.AdminTable, { caption: 'Gallery photos', columns: [{ key: 'title', label: 'Caption' }, { key: 'date', label: 'Event date' }, { key: 'status', label: 'Status' }, { key: 'size', label: 'Size', align: 'end' }, { key: 'act', label: 'Actions', align: 'end' }],
  rows: [
    { title: '[Event caption]', date: '[dd Mon yyyy]', status: h(Pub, { state: 'published' }), size: '1.8 MB', act: h('span', { style: { display: 'inline-flex', gap: 4 } }, h(S.Button, { size: 'sm', variant: 'tertiary', icon: 'edit', label: 'Edit' }), h(S.Button, { size: 'sm', variant: 'tertiary', icon: 'trash', label: 'Delete' })) },
    { title: '[Event caption]', date: '[dd Mon yyyy]', status: h(Pub, { state: 'draft' }), size: '2.4 MB', act: h(S.Button, { size: 'sm', variant: 'tertiary', icon: 'edit', label: 'Edit' }) },
    { title: '[Untitled upload]', date: '—', status: h(Pub, { state: 'failed' }), size: '6.1 MB', act: h(S.Button, { size: 'sm', variant: 'secondary' }, 'Retry') }
  ] }));
</script>
</body>
</html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alert — preview</title></head>
<body>
<div id="root" class="s1-stack"></div>
<script>
var S = window.S1P, h = React.createElement, useState = React.useState;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gap: 12, maxWidth: 640 } },
  h(S.Alert, { tone: 'success', title: 'Thank you — your contribution was received.' }, 'A receipt is on its way to name@example.com.'),
  h(S.Alert, { tone: 'error', title: 'The payment didn’t go through.', action: h(S.Button, { size: 'sm', variant: 'secondary' }, 'Try again') }, 'Nothing was charged. Check your details or try another method.'),
  h(S.Alert, { tone: 'warning', title: 'This photo has no caption yet.' }, 'Add one before publishing so the gallery stays accessible.'),
  h(S.Alert, { tone: 'info', title: 'Figures are rounded to the nearest hundred.', onDismiss: function () {} })));
